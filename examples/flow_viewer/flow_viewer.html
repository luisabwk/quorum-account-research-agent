<style>:root {
  --ground: #eef1f4;
  --dots: #cbd3dc;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --ink: #15202b;
  --muted: #5a6776;
  --line: #d9dfe6;
  --accent: #1f5faf;
  --accent-soft: #e3edf9;
  --ok: #1d7f54;
  --ok-soft: #e3f3eb;
  --warn: #a86a09;
  --warn-soft: #fbf0dc;
  --bad: #b8432f;
  --bad-soft: #f8e6e2;
  --idle: #8a96a3;
  --code-bg: #f3f5f8;
  --shadow: 0 1px 2px rgba(21, 32, 43, 0.06), 0 4px 14px rgba(21, 32, 43, 0.06);
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1419; --dots: #1f2a35; --surface: #151d25; --surface-2: #1a232d; --ink: #e4eaf0;
    --muted: #93a1b0; --line: #26323e; --accent: #6fa8f5; --accent-soft: #1b2b40; --ok: #46b98a;
    --ok-soft: #15302a; --warn: #e0a43a; --warn-soft: #34290f; --bad: #e57a64; --bad-soft: #3a1f1a;
    --idle: #5f6d7b; --code-bg: #111920; --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.3);
  }
}
:root[data-theme="dark"] {
  --ground: #0e1419; --dots: #1f2a35; --surface: #151d25; --surface-2: #1a232d; --ink: #e4eaf0;
  --muted: #93a1b0; --line: #26323e; --accent: #6fa8f5; --accent-soft: #1b2b40; --ok: #46b98a;
  --ok-soft: #15302a; --warn: #e0a43a; --warn-soft: #34290f; --bad: #e57a64; --bad-soft: #3a1f1a;
  --idle: #5f6d7b; --code-bg: #111920; --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.3);
}

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font: 14px/1.5 var(--sans); margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }

.app { display: grid; grid-template-columns: 230px minmax(0, 1fr) 400px; grid-template-rows: auto 1fr; height: 100vh; }
.topbar {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar h1 { font: 600 18px/1.2 var(--cond); margin: 0; letter-spacing: 0.01em; }
.chip { font: 500 11px/1 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 8px; border-radius: 4px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.topbar .spacer { flex: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 0; border-top: 2px solid var(--accent); display: inline-block; }
.legend i.dash { border-top: 2px dashed var(--idle); }

/* Runs list */
.runs { overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface); padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
.runs h2, .panel-label { font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 4px 4px 6px; }
.run { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 10px 11px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
.run:hover { border-color: var(--muted); }
.run[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); background: var(--accent-soft); }
.run .t { font: 600 13.5px/1.3 var(--cond); text-wrap: balance; }
.run .a { font-size: 12px; color: var(--muted); }
.run .m { font: 11.5px/1.3 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--sans); padding: 4px 7px; border-radius: 999px; width: fit-content; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-ok { color: var(--ok); background: var(--ok-soft); }
.s-warn { color: var(--warn); background: var(--warn-soft); }
.s-bad { color: var(--bad); background: var(--bad-soft); }
.s-idle { color: var(--muted); background: var(--surface-2); }
.s-info { color: var(--accent); background: var(--accent-soft); }

/* Canvas */
.center { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
.scenario-head { padding: 12px 20px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--line); background: var(--surface); }
.scenario-head .t { font: 600 16px/1.25 var(--cond); }
.scenario-head p { margin: 0; max-width: 90ch; color: var(--muted); font-size: 13px; }
.scenario-head .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.canvas-wrap {
  position: relative; overflow: auto; min-height: 0;
  background-color: var(--ground);
  background-image: radial-gradient(var(--dots) 1px, transparent 1px);
  background-size: 18px 18px;
}
.zoom { position: sticky; top: 10px; left: 10px; z-index: 3; display: inline-flex; gap: 4px; margin: 10px; }
.zoom button { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 4px 9px; font-size: 12px; cursor: pointer; }
.zoom button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.stage { position: relative; transform-origin: 0 0; margin: -20px 0 0 10px; }
.stage svg { position: absolute; inset: 0; overflow: visible; }
.edge { fill: none; stroke: var(--idle); stroke-width: 1.5; stroke-dasharray: 5 5; opacity: 0.55; }
.edge.on { stroke: var(--accent); stroke-dasharray: none; opacity: 1; stroke-width: 2; }
.edge-label { font: 500 11px var(--sans); fill: var(--muted); }
.edge-label.on { fill: var(--accent); }

.node {
  position: absolute; width: 150px; min-height: 80px; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: left;
  background: var(--surface); border: 1.5px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 3px;
}
.node .k { font: 600 9.5px/1 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 4px; }
.node .n { font: 600 14px/1.15 var(--cond); }
.node .d { font-size: 11.5px; line-height: 1.3; color: var(--muted); }
.node .x { position: absolute; top: -9px; right: -9px; font: 600 11px/1 var(--mono); background: var(--ink); color: var(--surface); border-radius: 999px; padding: 4px 6px; }
.node.ran { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.node.idle { background: transparent; border-style: dashed; box-shadow: none; }
.node.idle .n, .node.idle .d { color: var(--idle); }
.node.warn { border-color: var(--warn); }
.node.bad { border-color: var(--bad); }
.node.good { border-color: var(--ok); }
.node[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Timeline */
.timeline { border-top: 1px solid var(--line); background: var(--surface); padding: 8px 20px 10px; display: flex; gap: 6px; overflow-x: auto; align-items: center; }
.timeline .panel-label { margin: 0 6px 0 0; white-space: nowrap; }
.tick { flex: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 5px; padding: 4px 8px; font: 12px/1.2 var(--sans); cursor: pointer; white-space: nowrap; }
.tick b { font: 600 11px var(--mono); color: var(--muted); margin-right: 5px; }
.tick[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tick.err { border-color: var(--bad); }

/* Inspector */
.inspector { overflow-y: auto; background: var(--surface); border-left: 1px solid var(--line); padding: 16px 18px 40px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.inspector h2 { font: 600 20px/1.2 var(--cond); margin: 0; text-wrap: balance; }
.inspector .what { margin: 0; color: var(--muted); font-size: 13px; }
.summary { font-size: 14px; padding: 10px 12px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); }
.execs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { border: 0; background: none; padding: 7px 10px; cursor: pointer; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
section.block { display: flex; flex-direction: column; gap: 8px; }
section.block > h3 { font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 6px 0 0; }

.doc { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.doc .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.doc .tool { font: 500 11.5px var(--mono); color: var(--accent); }
.doc .title { font-weight: 600; }
.doc blockquote { margin: 0; padding: 6px 10px; border-left: 2px solid var(--line); color: var(--ink); font-size: 13px; background: var(--surface-2); }
.doc .meta { font: 11.5px/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.cls { font: 600 11px/1 var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; white-space: nowrap; }

.item { border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; display: flex; flex-direction: column; gap: 5px; }
.item .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.item .id { font: 500 11.5px var(--mono); color: var(--muted); }
.item q { font-size: 12.5px; color: var(--muted); quotes: "“" "”"; }
.reasons { margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--bad); }
.reasons.warn { color: var(--warn); }

dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 5px 14px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

.meter { display: grid; grid-template-columns: 110px 1fr 44px; gap: 10px; align-items: center; font-size: 13px; }
.meter .bar { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
.meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); }
.meter .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--bad); }
.meter .v { font: 12px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }

.email { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.email .h { padding: 8px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 13px; display: grid; grid-template-columns: 64px 1fr; gap: 2px 8px; }
.email .h span:nth-child(odd) { color: var(--muted); }
.email .b { padding: 12px; white-space: pre-wrap; font-size: 13.5px; line-height: 1.55; }
.cites { display: flex; gap: 5px; flex-wrap: wrap; }
.cites span { font: 11px var(--mono); padding: 3px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
.cites span.bad { color: var(--bad); border-color: var(--bad); }

.call { border: 1px solid var(--line); border-radius: 6px; }
.call > summary { list-style: none; cursor: pointer; padding: 9px 11px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.call > summary::-webkit-details-marker { display: none; }
.call .model { font: 500 12.5px var(--mono); }
.call .nums { font: 11.5px var(--mono); color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.call .body { padding: 0 11px 11px; display: flex; flex-direction: column; gap: 8px; }
.msg-role { font: 600 10.5px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
pre { margin: 0; padding: 10px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; font: 11.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow: auto; }

@media (max-width: 1200px) {
  .app { grid-template-columns: 230px minmax(0, 1fr); grid-template-rows: auto minmax(520px, 70vh) auto; height: auto; }
  .inspector { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(460px, 70vh) auto; }
  .runs { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .runs h2 { display: none; }
  .run { min-width: 220px; }
}
@media (prefers-reduced-motion: no-preference) {
  .node, .run, .tick { transition: border-color 0.15s, background-color 0.15s; }
}
</style>

<script>// Inspector content: a plain-language summary and the tabs for the selected step.
window.FlowViews = (() => {
  const A = () => window.FlowApp;
  const esc = (v) => A().esc(v);
  const CLASS = { 1: "official government", 2: "official company", 3: "trusted publication", 4: "enrichment provider", 5: "unknown source" };
  const STATUS = { verified: "s-ok", needs_review: "s-warn", rejected: "s-bad" };
  const pill = (s) => s ? `<span class="pill ${STATUS[s] || "s-idle"}">${esc(s.replace("_", " "))}</span>` : "";
  const cls = (n) => `<span class="cls" title="Source class ${n}: ${CLASS[n]}">class ${n} · ${CLASS[n]}</span>`;
  const day = (iso) => (iso || "").slice(0, 10) || "no date";
  const json = (v) => `<pre>${esc(JSON.stringify(v, null, 2))}</pre>`;
  const block = (title, html) => html ? `<section class="block"><h3>${esc(title)}</h3>${html}</section>` : "";
  const reasons = (list, warn) => list?.length ? `<ul class="reasons ${warn ? "warn" : ""}">${list.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>` : "";

  function claimCard(c) {
    return `<div class="item"><div class="top"><span class="id">${esc(c.claim_id)}</span>${pill(c.status)}</div>
      <div>${esc(c.statement)}</div><q>${esc(c.evidence_excerpt)}</q>
      <div class="top"><span class="mono muted">${day(c.published_at)} · relevance ${c.relevance ?? "–"}</span>${cls(c.source_class)}</div>
      ${reasons(c.rejection_reasons, c.status === "needs_review")}</div>`;
  }
  function personCard(p) {
    return `<div class="item"><div class="top"><strong>${esc(p.full_name)}</strong>${pill(p.status)}</div>
      <div class="muted">${esc(p.title)}${p.email ? ` · <span class="mono">${esc(p.email)}</span>` : ""}</div>
      <div class="top"><span class="mono muted">${p.company_domain_match ? "domain matches account" : "domain does not match"} · verified ${day(p.last_verified_at)}</span>${cls(p.source_class)}</div>
      ${reasons(p.rejection_reasons)}</div>`;
  }
  function docCard(d) {
    if (d.error) return `<div class="doc"><div class="top"><span class="tool">${esc(d.tool)}</span><span class="pill s-bad">error</span></div><div>${esc(d.error)}</div></div>`;
    if (d.passages) return d.passages.map((p) => `<div class="doc"><div class="top"><span class="tool">kb_retrieve</span><span class="mono muted">${esc(p.kb_id)} v${p.version}</span></div><div class="title">${esc(p.title)}</div><blockquote>${esc(p.text)}</blockquote></div>`).join("");
    if (d.note) return `<div class="doc"><div class="top"><span class="tool">${esc(d.tool)}</span></div><div class="muted">${esc(d.note)}</div></div>`;
    return `<div class="doc"><div class="top"><span class="tool">${esc(d.tool)}</span>${cls(d.source_class)}</div>
      <div class="title">${esc(d.title)}</div><blockquote>${esc(d.text)}</blockquote>
      <div class="meta">${esc(d.url)}<br>published ${day(d.published_at)} · snapshot ${esc(d.snapshot_key)}</div></div>`;
  }
  function email(draft, run, invalid) {
    const people = run.steps.flatMap((s) => (s.output?.stakeholders || [])).concat(run.result.draft_stakeholder ? [run.result.draft_stakeholder] : []);
    const to = people.find((p) => p.stakeholder_id === draft.stakeholder_id);
    const chip = (id) => `<span class="${invalid.includes(id) ? "bad" : ""}">${esc(id)}</span>`;
    return `<div class="email"><div class="h"><span>To</span><span>${esc(to ? `${to.full_name}, ${to.title}` : draft.stakeholder_id)}</span><span>Subject</span><span>${esc(draft.subject)}</span></div>
      <div class="b">${esc(draft.body)}</div></div>
      <div class="cites">${draft.cited_claim_ids.map(chip).join("")}${(draft.cited_kb_ids || []).map(chip).join("")}</div>`;
  }
  const meter = (label, v, floor) => `<div class="meter"><span>${esc(label)}</span><span class="bar"><span class="fill" style="width:${Math.round(v * 100)}%"></span>${floor != null ? `<span class="mark" style="left:${floor * 100}%" title="floor ${floor}"></span>` : ""}</span><span class="v">${v}</span></div>`;
  const score5 = (label, v) => `<div class="meter"><span>${esc(label)}</span><span class="bar"><span class="fill" style="width:${v * 20}%"></span></span><span class="v">${v}/5</span></div>`;

  function summary(run, id, step, execs) {
    const out = step?.output || {};
    const res = run.result;
    if (id === "trigger") {
      const a = run.account;
      return run.parent_run_id
        ? `The SDR asked for a <strong>${esc(run.rerun_request.scope.replace("_", " "))}</strong> rerun of <span class="mono">${esc(run.parent_run_id)}</span>: “${esc(run.rerun_request.reviewer_feedback)}”`
        : `<strong>${esc(a.name)}</strong> · ICP fit ${a.icp_fit} · 6sense intent ${a.intent_score} · Qualified engagement ${a.engagement_score}${a.is_customer ? " · <strong>existing customer</strong>" : ""}${a.open_opportunity ? " · open opportunity" : ""}`;
    }
    if (id === "salesforce") return run.salesforce_request.mapping_error ? esc(run.salesforce_request.mapping_error) : `One Composite API call with allOrNone: Account summary fields${res.draft ? " plus the outreach draft record" : ""}. Claims and sources stay in MongoDB.`;
    if (!step) return run.parent_run_id ? "Not re-run: this rerun reuses the parent run's evidence from its checkpoint." : "This step did not run in this scenario.";
    if (step.error) return `Failed: ${esc(step.error)}`;
    if (id === "prioritize") return out.outcome === "skipped" ? `Priority ${out.execution_priority}. <strong>Skipped</strong>: existing customers go to Account Management, so no tool or model is called.` : `Priority ${out.execution_priority}, so research depth is <strong>${out.depth}</strong>.`;
    if (id.startsWith("research_branch")) {
      if (out.branch_errors?.length) return `No data: ${esc(out.branch_errors.join("; "))}. The run continues without this branch.`;
      const rej = (out.claims || []).filter((c) => c.status === "rejected").length;
      return `${step.tools.length} document${step.tools.length === 1 ? "" : "s"} found; the model extracted ${(out.claims || []).length} claims and ${(out.stakeholders || []).length} people.${rej ? ` <strong>${rej} rejected immediately</strong>: the quote is not in the source.` : ""}`;
    }
    if (id === "validate") {
      const all = (out.claims || []).concat(out.stakeholders || []);
      const n = (s) => all.filter((i) => i.status === s).length;
      return `<strong>${n("verified")}</strong> verified, <strong>${n("needs_review")}</strong> kept for human review, <strong>${n("rejected")}</strong> rejected. Only verified evidence can reach the email.`;
    }
    if (id === "research_judge") {
      const retry = out.branches_to_retry?.length ? ` Re-researching <strong>${out.branches_to_retry.join(", ")}</strong> once.` : "";
      return step.llm.length ? `The judge rejected ${countJudged(out)} item(s) the evidence does not support.${retry}` : `Skipped: nothing was verified, so there is nothing to audit.${retry}`;
    }
    if (id === "score") return out.outcome ? `Evidence confidence ${out.confidence_score} is below the 0.3 floor or no stakeholder is verified. <strong>Sent to a human</strong> instead of drafting.` : `Account priority ${out.priority_score} · evidence confidence ${out.confidence_score}. Good enough to draft.`;
    if (id === "synthesize") return `Angle: “${esc(out.brief?.outreach_angle)}”`;
    if (id === "personalize") {
      const failed = step.llm.filter((c) => c.status !== "ok").map((c) => c.model);
      return `Draft ${execs.indexOf(step) + 1} written by <span class="mono">${esc(step.llm.find((c) => c.status === "ok")?.model)}</span>${failed.length ? ` after <span class="mono">${esc(failed.join(", "))}</span> was unavailable` : ""}.`;
    }
    if (id === "delivery_judge") {
      const v = out.delivery_verdict;
      if (!step.llm.length) return `<strong>Failed without a model call</strong>: ${esc(v.critique)}`;
      return `${v.groundedness >= 4 && v.approved_capabilities_only && v.relevance >= 3 && v.tone_and_length >= 3 ? "<strong>Passed</strong>" : "<strong>Failed</strong>"} (judge <span class="mono">${esc(step.llm.find((c) => c.status === "ok")?.model)}</span>). ${esc(v.critique)}`;
    }
    if (id === "finalize") return `Saved as <strong>${esc(res.outcome.replaceAll("_", " "))}</strong>, queued for Salesforce and posted to Slack for SDR review.`;
    return "";
  }
  const countJudged = (out) => (out.claims || []).concat(out.stakeholders || []).filter((i) => (i.rejection_reasons || []).some((r) => r.startsWith("research judge"))).length;

  function dataTab(run, id, step) {
    const out = step?.output || {}, inp = step?.input || {};
    if (id === "trigger") return run.parent_run_id ? json(run.rerun_request) : json(run.account);
    if (id === "salesforce") {
      const req = run.salesforce_request;
      if (req.mapping_error) return json(req);
      return req.compositeRequest.map((r) => block(`${r.method} ${r.referenceId}`, `<div class="mono muted">${esc(r.url)}</div><dl class="kv">${Object.entries(r.body).map(([k, v]) => `<dt class="mono">${esc(k)}</dt><dd>${v === null ? '<span class="muted">null (clears old value)</span>' : esc(v)}</dd>`).join("")}</dl>`)).join("");
    }
    if (!step) return "";
    if (id === "prioritize") return `<dl class="kv"><dt>execution priority</dt><dd>${out.execution_priority}</dd><dt>depth</dt><dd>${out.depth}</dd><dt>outcome</dt><dd>${out.outcome || "continue"}</dd></dl><p class="muted">0.4 × ICP fit + 0.3 × intent/100 + 0.3 × engagement/100. Below 0.35 skip, from 0.65 deep.</p>`;
    if (id.startsWith("research_branch")) {
      return block("Found by the tools", step.tools.map(docCard).join("") || '<p class="muted">No documents.</p>')
        + block("Extracted claims", (out.claims || []).map(claimCard).join(""))
        + block("Extracted people", (out.stakeholders || []).map(personCard).join(""))
        + block("Errors", (out.branch_errors || []).map((e) => `<div class="item">${esc(e)}</div>`).join(""));
    }
    if (["validate", "research_judge", "score"].includes(id)) {
      const claims = out.claims || inp.claims || [], people = out.stakeholders || inp.stakeholders || [];
      const scores = id === "score" ? meter("Priority", out.priority_score) + meter("Confidence", out.confidence_score, 0.3) : "";
      return scores + block("Claims", claims.map(claimCard).join("")) + block("People", people.map(personCard).join(""));
    }
    if (id === "synthesize") {
      const b = out.brief;
      return `<dl class="kv"><dt>summary</dt><dd>${esc(b.summary)}</dd><dt>hypothesis</dt><dd>${esc(b.commercial_hypothesis)}</dd><dt>angle</dt><dd>${esc(b.outreach_angle)}</dd><dt>cites</dt><dd class="mono">${esc(b.cited_claim_ids.join(", "))}</dd></dl>`
        + block("Approved Quorum knowledge retrieved", step.tools.map(docCard).join(""));
    }
    if (id === "personalize") {
      if (!out.draft) return json(out);
      const valid = run.steps.flatMap((s) => (s.output?.claims || []).filter((c) => c.status === "verified").map((c) => c.claim_id));
      const kb = run.steps.flatMap((s) => s.tools.flatMap((t) => (t.passages || []).map((p) => p.kb_id)));
      const invalid = [...out.draft.cited_claim_ids, ...(out.draft.cited_kb_ids || [])].filter((x) => !valid.includes(x) && !kb.includes(x));
      return (inp.reviewer_feedback ? block("SDR feedback in the prompt", `<div class="item">${esc(inp.reviewer_feedback)}</div>`) : "")
        + (inp.judge_critique ? block("Judge critique from the previous draft", `<div class="item">${esc(inp.judge_critique)}</div>`) : "")
        + block("Draft", email(out.draft, run, invalid));
    }
    if (id === "delivery_judge") {
      const v = out.delivery_verdict;
      return score5("Groundedness", v.groundedness) + score5("Relevance", v.relevance) + score5("Tone & length", v.tone_and_length)
        + `<dl class="kv"><dt>approved KB only</dt><dd>${v.approved_capabilities_only}</dd><dt>critique</dt><dd>${esc(v.critique)}</dd><dt>next</dt><dd>${esc(out.outcome || "rewrite")}</dd></dl>`;
    }
    if (id === "finalize") return block("Saved and posted", step.tools.map(docCard).join("")) + json(run.result);
    return json(out);
  }

  function callsTab(step) {
    if (!step || !step.llm.length) return '<p class="muted">No model call in this step. This part is deterministic code.</p>';
    return step.llm.map((c) => `<details class="call"><summary><span class="model">${esc(c.model)}</span>
        <span class="pill ${c.status === "ok" ? "s-ok" : "s-bad"}">${esc(c.status)}</span>
        <span class="nums">${c.status === "ok" ? `${c.tokens_in} in · ${c.tokens_out} out · ${A().money(c.cost_usd)}` : ""}</span></summary>
      <div class="body"><span class="msg-role">schema</span><span class="mono">${esc(c.schema)}</span>
      ${c.messages.map((mm) => `<span class="msg-role">${esc(mm.role)}</span><pre>${esc(mm.content)}</pre>`).join("")}
      ${c.response ? `<span class="msg-role">response</span>${json(c.response)}` : ""}</div></details>`).join("")
      + '<p class="muted">Token counts are estimates (4 characters per token) priced with the OpenRouter snapshot.</p>';
  }

  function tab(name, run, id, step) {
    if (name === "model calls") return callsTab(step);
    if (name === "input") return json(step.input);
    if (name === "output") return json(step.output ?? { error: step.error });
    return dataTab(run, id, step);
  }

  return { summary, tab };
})();

  const NODES = [
    { id: "trigger", x: 20, y: 190, kind: "Trigger", name: "Salesforce account", what: "The account enters the queue with its CRM, 6sense and Qualified fields." },

    { id: "research_branch:stakeholder", x: 400, y: 190, kind: "Tools + LLM", name: "Stakeholder research", what: "Salesforce contacts, company pages, ZoomInfo when Salesforce has gaps." },

    { id: "research_judge", x: 780, y: 190, kind: "LLM judge", name: "Research judge", what: "Does each excerpt support its claim? Is each person at this company? Incomplete branches are re-researched once." },
    { id: "score", x: 970, y: 190, kind: "Rule · D3", name: "Score", what: "Account priority and evidence confidence, from verified evidence only. Low confidence goes to a human." },
    { id: "synthesize", x: 210, y: 470, kind: "LLM + KB", name: "Synthesize brief", what: "Account brief, commercial hypothesis and outreach angle, grounded in verified claims and the approved Quorum KB." },
    { id: "personalize", x: 400, y: 470, kind: "LLM", name: "Personalize draft", what: "Writes the email. Must cite a claim id for every fact and a KB id for every Quorum capability." },
    { id: "delivery_judge", x: 590, y: 470, kind: "LLM judge", name: "Delivery judge", what: "Scores groundedness, approved capabilities, relevance and tone. A model from a different family than the writer." },
    { id: "finalize", x: 780, y: 470, kind: "Write", name: "Save & review", what: "Result and Salesforce outbox entry in one MongoDB transaction, then a Slack review card." },
    { id: "salesforce", x: 970, y: 470, kind: "Outbox", name: "Salesforce update", what: "The outbox worker sends one Composite API request: Account summary fields plus the draft record." },
  ];
  const BY_ID = Object.fromEntries(NODES.map((n) => [n.id, n]));
  const BRANCHES = ["regulatory", "stakeholder", "news"];
  const port = (id, side) => {
    const n = BY_ID[id];
    return { top: [n.x + W / 2, n.y], bottom: [n.x + W / 2, n.y + H], left: [n.x, n.y + H / 2], right: [n.x + W, n.y + H / 2] }[side];
  };
  const line = (a, b) => `M${a[0]} ${a[1]} C${a[0] + 60} ${a[1]}, ${b[0] - 60} ${b[1]}, ${b[0]} ${b[1]}`;

  const state = { run: DATA[0], nodeId: "trigger", exec: 0, tab: "data" };

  function nodeIdOf(step) {
    return step.node === "research_branch" ? `research_branch:${step.input.branch}` : step.node;
  }
  function execsOf(run, nodeId) {
    return run.steps.filter((s) => nodeIdOf(s) === nodeId);
  }

  function edgesFor(run) {
    const ran = (id) => id === "trigger" || id === "salesforce" ? true : execsOf(run, id).length > 0;
    const first = run.steps[0] ? nodeIdOf(run.steps[0]) : "prioritize";
    const retried = run.steps.some((s) => s.node === "research_branch" && s.input.attempt > 0);
    const rewrites = execsOf(run, "personalize").length > 1;
    const e = [];
    if (first === "prioritize") e.push({ d: line(port("trigger", "right"), port("prioritize", "left")), on: true });
    else e.push({ d: `M${port("trigger", "bottom")[0]} ${port("trigger", "bottom")[1]} C95 420, 475 150, ${port(first, "left")[0] - 4} ${port(first, "left")[1]}`, on: true, label: ["SDR rerun from Slack", 40, 440] });
    BRANCHES.forEach((b) => {
      const id = `research_branch:${b}`;
      const fromPrior = execsOf(run, id).some((s) => s.input.attempt === 0) && ran("prioritize");
      e.push({ d: line(port("prioritize", "right"), port(id, "left")), on: fromPrior });
      e.push({ d: line(port(id, "right"), port("validate", "left")), on: ran(id) });
    });
    e.push({ d: line(port("validate", "right"), port("research_judge", "left")), on: ran("research_judge") });
    e.push({ d: line(port("research_judge", "right"), port("score", "left")), on: ran("score") });
    e.push({ d: `M855 190 C855 20, 475 10, 475 70`, on: retried, label: ["re-research once", 600, 36] });
    const [sx, sy] = port("score", "bottom"), [tx, ty] = port("synthesize", "top");
    e.push({ d: `M${sx} ${sy} C${sx} 400, ${tx} 360, ${tx} ${ty}`, on: ran("synthesize") });
    e.push({ d: line(port("synthesize", "right"), port("personalize", "left")), on: ran("personalize") });
    e.push({ d: line(port("personalize", "right"), port("delivery_judge", "left")), on: ran("delivery_judge") });
    e.push({ d: `M665 550 C665 640, 475 640, 475 550`, on: rewrites, label: ["rewrite once with critique", 480, 650] });
    e.push({ d: line(port("delivery_judge", "right"), port("finalize", "left")), on: ran("delivery_judge") && ran("finalize") });
    const skipped = ran("prioritize") && !BRANCHES.some((b) => ran(`research_branch:${b}`));
    e.push({ d: `M285 270 C285 380, 830 360, 850 470`, on: skipped, label: ["skip", 330, 360] });
    const human = ran("score") && !ran("synthesize");
    e.push({ d: `M1030 270 C1030 400, 870 380, 870 470`, on: human, label: ["needs human", 960, 440] });
    e.push({ d: line(port("finalize", "right"), port("salesforce", "left")), on: ran("finalize") });
    return e;
  }

  function nodeFacts(run, id) {
    const ex = execsOf(run, id);
    const last = ex[ex.length - 1];
    const res = run.result;
    if (id === "trigger") return { cls: "ran", d: `${run.account.name}${run.parent_run_id ? " · rerun" : ""}` };
    if (id === "salesforce") return run.salesforce_request.mapping_error ? { cls: "bad", d: "mapping error" } : { cls: "ran", d: `${run.salesforce_request.compositeRequest.length} records queued` };
    if (!last) return { cls: "idle", d: run.parent_run_id && ["prioritize", "research_branch:regulatory", "research_branch:news"].includes(id) ? "reused from parent run" : "did not run" };
    const out = last.output || {};
    if (last.error) return { cls: "bad", d: "error" };
    if (id === "prioritize") return { cls: out.outcome === "skipped" ? "warn" : "ran", d: `priority ${out.execution_priority} · ${out.depth}` };
    if (id.startsWith("research_branch")) {
      if (out.branch_errors?.length) return { cls: "warn", d: out.branch_errors[0].split(": ").slice(1).join(": ").slice(0, 42) };
      const n = (out.claims || []).length + (out.stakeholders || []).length;
      return { cls: "ran", d: `${last.tools.length} docs → ${n} items` };
    }
    if (id === "validate") {
      const c = count([...(out.claims || []), ...(out.stakeholders || [])]);
      return { cls: "ran", d: `${c.verified || 0} ok · ${c.needs_review || 0} review · ${c.rejected || 0} rejected` };
    }
    if (id === "research_judge") return last.llm.length ? { cls: "ran", d: `${judged(out)} rejected${out.branches_to_retry?.length ? " · retry" : ""}` } : { cls: "warn", d: `skipped: nothing to audit${out.branches_to_retry?.length ? " · retry" : ""}` };
    if (id === "score") return { cls: out.outcome ? "warn" : "ran", d: `conf. ${out.confidence_score}${out.outcome ? " · to human" : ""}` };
    if (id === "synthesize") return { cls: "ran", d: "brief written" };
    if (id === "personalize") return { cls: "ran", d: `${ex.length} draft${ex.length > 1 ? "s" : ""} · ${modelOk(last)}` };
    if (id === "delivery_judge") return { cls: out.outcome === "ready_for_review" ? "good" : out.outcome ? "bad" : "warn", d: out.outcome === "ready_for_review" ? "passed" : out.outcome ? "failed twice" : "failed, rewrite" };
    if (id === "finalize") return { cls: res.outcome === "ready_for_review" ? "good" : res.outcome === "skipped" ? "ran" : "warn", d: res.outcome.replaceAll("_", " ") };
    return { cls: "ran", d: "" };
  }
  const count = (items) => items.reduce((acc, i) => ((acc[i.status] = (acc[i.status] || 0) + 1), acc), {});
  const judged = (out) => (out.claims || []).concat(out.stakeholders || []).filter((i) => (i.rejection_reasons || []).some((r) => r.startsWith("research judge"))).length;
  const modelOk = (step) => (step.llm.find((c) => c.status === "ok")?.model || "").split("/")[1] || "no model call";

  function renderRuns() {
    $("#runs").innerHTML = '<h2>Runs</h2>' + DATA.map((r) => `
      <button class="run" data-run="${r.id}" aria-current="${r === state.run}">
        <span class="t">${esc(r.title)}</span>
        <span class="a">${esc(r.account.name)}</span>
        ${outcomePill(r.result.outcome)}
        <span class="m">${r.steps.length} steps · ${r.llm_calls} model · ${r.tool_calls} tool · ${money(r.llm_cost_usd)}</span>
      </button>`).join("");
  }
  function outcomePill(o) {
    const cls = { ready_for_review: "s-ok", skipped: "s-idle", needs_human_research: "s-warn", low_quality_draft: "s-bad" }[o] || "s-info";
    return `<span class="pill ${cls}">${esc(o.replaceAll("_", " "))}</span>`;
  }

  function renderHead() {
    const r = state.run;
    $("#scenario").innerHTML = `
      <div class="row"><span class="t">${esc(r.title)}</span>${outcomePill(r.result.outcome)}
      ${r.parent_run_id ? `<span class="chip">rerun of ${esc(r.parent_run_id)}</span>` : ""}
      <span class="mono muted">${esc(r.run_id)}</span></div><p>${esc(r.shows)}</p>`;
  }

  function renderCanvas() {
    const r = state.run;
    const svg = edgesFor(r).map((e) => `<path class="edge ${e.on ? "on" : ""}" d="${e.d}"/>` +
      (e.label ? `<text class="edge-label ${e.on ? "on" : ""}" x="${e.label[1]}" y="${e.label[2]}">${esc(e.label[0])}</text>` : "")).join("");
    const nodes = NODES.map((n) => {
      const f = nodeFacts(r, n.id);
      const times = execsOf(r, n.id).length;
      return `<button class="node ${f.cls}" style="left:${n.x}px;top:${n.y}px" data-node="${n.id}" aria-pressed="${state.nodeId === n.id}">
        <span class="k"><span>${esc(n.kind)}</span></span><span class="n">${esc(n.name)}</span><span class="d">${esc(f.d)}</span>
        ${times > 1 ? `<span class="x">×${times}</span>` : ""}</button>`;
    }).join("");
    $("#stage").innerHTML = `<svg width="1140" height="670" viewBox="0 0 1140 670" aria-hidden="true">${svg}</svg>${nodes}`;
    $("#stage").style.width = "1140px";
    $("#stage").style.height = "670px";
    fit();
  }
  function fit() {
    const wrap = $("#canvas"), stage = $("#stage");
    const mode = document.querySelector(".zoom [aria-pressed=true]")?.dataset.zoom || "fit";
    const scale = mode === "fit" ? Math.max(0.72, Math.min(1, (wrap.clientWidth - 30) / 1140)) : 1;
    stage.style.transform = `scale(${scale})`;
    stage.style.marginBottom = `${-670 * (1 - scale)}px`;
    stage.style.marginRight = `${-1140 * (1 - scale)}px`;
  }

  function renderTimeline() {
    $("#timeline").innerHTML = '<span class="panel-label">Execution order</span>' + state.run.steps.map((s) => {
      const id = nodeIdOf(s);
      const idx = execsOf(state.run, id).indexOf(s);
      const on = state.nodeId === id && state.exec === idx;
      return `<button class="tick ${s.error ? "err" : ""}" data-node="${id}" data-exec="${idx}" aria-pressed="${on}"><b>${s.seq}</b>${esc(s.label)}</button>`;
    }).join("");
  }

  function renderInspector() {
    const r = state.run, n = BY_ID[state.nodeId];
    const ex = execsOf(r, n.id);
    const step = ex[Math.min(state.exec, ex.length - 1)];
    const tabs = step ? ["data", "model calls", "input", "output"] : ["data"];
    if (!tabs.includes(state.tab)) state.tab = "data";
    const execButtons = ex.length > 1 ? `<div class="execs">${ex.map((s, i) => `<button class="tick" data-exec="${i}" aria-pressed="${i === state.exec}"><b>${s.seq}</b>run ${i + 1}</button>`).join("")}</div>` : "";
    const calls = step ? step.llm.length : 0;
    $("#inspector").innerHTML = `
      <div><span class="panel-label">${esc(n.kind)}</span><h2>${esc(n.name)}</h2></div>
      <p class="what">${esc(n.what)}</p>
      <div class="summary">${window.FlowViews.summary(r, n.id, step, ex)}</div>
      ${execButtons}
      <div class="tabs" role="tablist">${tabs.map((t) => `<button class="tab" role="tab" data-tab="${t}" aria-selected="${t === state.tab}">${t === "model calls" ? `model calls (${calls})` : t}</button>`).join("")}</div>
      <div>${window.FlowViews.tab(state.tab, r, n.id, step)}</div>`;
  }

  function render() { renderRuns(); renderHead(); renderCanvas(); renderTimeline(); renderInspector(); }

  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("button");
    if (!t) return;
    if (t.dataset.run) { state.run = DATA.find((r) => r.id === t.dataset.run); state.nodeId = "trigger"; state.exec = 0; state.tab = "data"; render(); return; }
    if (t.dataset.zoom) { document.querySelectorAll(".zoom button").forEach((b) => b.setAttribute("aria-pressed", String(b === t))); fit(); return; }
    if (t.dataset.tab) { state.tab = t.dataset.tab; renderInspector(); return; }
    if (t.dataset.node) { state.nodeId = t.dataset.node; state.exec = Number(t.dataset.exec || 0); renderCanvas(); renderTimeline(); renderInspector(); return; }
    if (t.dataset.exec) { state.exec = Number(t.dataset.exec); renderTimeline(); renderInspector(); }
  });
  window.addEventListener("resize", fit);
  window.FlowApp = { state, execsOf, nodeIdOf, esc, money, outcomePill, render };
  document.addEventListener("DOMContentLoaded", render);
  if (document.readyState !== "loading") render();
})();
</script>
